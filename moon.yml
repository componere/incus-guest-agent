language: 'go'
layer: 'application'
stack: 'backend'

project:
  title: 'incus-guest-agent'
  description: 'Incus guest agent supervisor for Talos static pods.'
  owner: 'componere'
  maintainers:
    - 'componere'

# Every task runs against `system` binaries that mise (mise.toml + mise.lock) puts
# on PATH; moon manages no language toolchain itself.
toolchains:
  default: 'system'

fileGroups:
  goSources:
    - 'cmd/**/*.go'
    - 'internal/**/*.go'
    - 'go.mod'
    - 'go.sum'
    # Tool/version pins. Under the `system` toolchain moon does not hash the Go
    # binary's version, so the mise pins are inputs here too — bumping Go (or any
    # tool) in mise must invalidate the cacheable build task.
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  releaseConfig:
    - '.goreleaser.yaml'
    - 'release-please-config.json'
    - '.release-please-manifest.json'
    - '.github/workflows/release.yml'
    - '.github/workflows/release-please.yml'
  imageConfig:
    - 'melange.yaml'
    - 'apko.yaml'
    - 'deploy/talos/**'
    - 'mise.toml'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint:
    command: 'golangci-lint run --config .golangci.yml ./... --show-stats=false'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  build:
    command: 'go build -o bin/incus-guest-agent ./cmd/incus-guest-agent'
    inputs:
      - '@group(goSources)'
    outputs:
      - 'bin/incus-guest-agent'

  test:
    command: 'go test ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:test'
      - 'docs:build'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(releaseConfig)'
      - '@group(imageConfig)'
    options:
      cache: false
      runInCI: true
