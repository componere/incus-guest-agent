site_name: incus-guest-agent
site_description: Operate the Incus guest agent in Talos virtual machines
site_url: https://componere.github.io/incus-guest-agent/
repo_name: componere/incus-guest-agent
repo_url: https://github.com/componere/incus-guest-agent
edit_uri: edit/master/docs/docs/
docs_dir: docs
site_dir: build
strict: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - How-to guides:
      - Install on Talos under Incus: how-to/install.md
      - Update and roll back: how-to/update-rollback.md
  - Reference:
      - Runtime and operations: reference/runtime.md
  - Explanation:
      - Why the static pod is privileged: explanation/privileged-static-pod.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/palette.css
