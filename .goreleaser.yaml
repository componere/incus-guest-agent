# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: incus-guest-agent

gomod:
  proxy: true
  env:
    - GOTOOLCHAIN=local
    - GOPROXY=https://proxy.golang.org,direct
    - GOSUMDB=sum.golang.org

# The reusable release unit runs `goreleaser release --clean --skip=publish`
# and then selects exactly one linux/amd64 and one linux/arm64 binary from
# dist/artifacts.json; those two binaries are the canonical bytes Melange
# packages and apko composes. Any other platform would be an unused artifact.
builds:
  - id: incus-guest-agent
    main: ./cmd/incus-guest-agent
    binary: incus-guest-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: incus-guest-agent
    ids:
      - incus-guest-agent
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

source:
  enabled: true

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive

# The Sigstore bundle over checksums.txt is the signature the reusable
# publisher verifies before it uploads any asset.
signs:
  - id: checksums
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  disable: true

# Release Please owns the tag and the changelog; the reusable publisher owns
# the GitHub Release. GoReleaser only stages and hands off.
release:
  disable: true
