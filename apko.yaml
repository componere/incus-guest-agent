contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - incus-guest-agent

entrypoint:
  command: /usr/bin/incus-guest-agent

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

environment:
  PATH: /usr/bin

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.title: incus-guest-agent
  org.opencontainers.image.description: Incus guest agent supervisor for Talos static pods
  org.opencontainers.image.source: https://github.com/componere/incus-guest-agent
  org.opencontainers.image.licenses: Apache-2.0 OR MIT
