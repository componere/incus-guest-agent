contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - incus-guest-agent-spike

entrypoint:
  command: /usr/bin/incus-guest-agent

accounts:
  run-as: 0

environment:
  PATH: /usr/bin

archs:
  - amd64
  - arm64

annotations:
  org.opencontainers.image.title: incus-guest-agent-static-pod-spike
  org.opencontainers.image.description: Disposable runnable image for the Talos static pod spike
  org.opencontainers.image.source: https://github.com/componere/incus-guest-agent
  org.opencontainers.image.licenses: Apache-2.0 OR MIT
